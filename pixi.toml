[workspace]
authors = ["wenxu yuan <yuanwenxu123@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "DBiTm-Brain"
platforms = [
    { platform = "linux-64", cuda = "12.9" },
    { name = "linux-64-bootstrap", platform = "linux-64" },
]
version = "0.1.0"

[environments.default]
platforms = ["linux-64-cuda-12-9"]

[environments.setup]
no-default-feature = true
platforms = ["linux-64-bootstrap"]
tasks.setup = { cmd = "bash env-install/setup.sh", description = "Install the HPC environment and configure R." }

[dependencies]
python = "3.12.*"
matplotlib-base = ">=3.11.1,<4"
pyranges = ">=0.1.4,<0.2"
numpy = ">=2.5.1,<3"
pandas = ">=3.0.5,<4"
anndata = ">=0.13.2,<0.14"
pillow = ">=12.3.0,<13"
scipy = ">=1.18.0,<2"
scanpy = ">=1.12.3,<2"
scikit-learn = ">=1.9.0,<2"
umap-learn = ">=0.5.12,<0.6"
python-igraph = ">=1.0.0,<2"
leidenalg = ">=0.12.0,<0.13"
mudata = ">=0.3,<0.4"
muon = ">=0.1.9,<0.2"
r-base = "4.5.*"
bioconductor-chipseeker = ">=1.46.1,<2"
bioconductor-txdbmaker = ">=1.6.2,<2"
"bioconductor-txdb.hsapiens.ucsc.hg19.knowngene" = ">=3.22.1,<4"
"bioconductor-go.db" = ">=3.22.0,<4"
click = "8.5.*"
pytorch-gpu = "==2.13.0"
cuda-version = "12.9.*"

[pypi-dependencies]
rctd-py = ">=0.3.9, <0.4"
